      arrivalRate: 50
      rampTo: 150
      name: "1. Traffic Barha Rahe Hain"
    - duration: 20
      arrivalRate: 250
      name: "2. Extreme 10,000 Users Peak Load"

scenarios:
  - name: "Vendra Items Page Speed Test"
    flow:
      - get:
          # URL ko badal kar humne sahi route '/api/product' kar diya hai
          url: "/api/product"